version: "3.9"

# Local simulation of the Railway cloud deployment.
# Usage:
#   cp .env .env.docker   # edit .env.docker — set AI_SERVICE_URL=http://ai-service:3457
#   docker compose up --build

services:
  ai-service:
    build:
      context: .
      dockerfile: packages/ai-service/Dockerfile
    container_name: kibitz-ai-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3457"
      NODE_ENV: production
    ports:
      - "3457:3457"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3457/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    container_name: kibitz-bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Override AI_SERVICE_URL to point to the Docker service name
      AI_SERVICE_URL: "http://ai-service:3457"
    depends_on:
      ai-service:
        condition: service_healthy

networks:
  default:
    name: kibitz-network
